# Nginx site config for the FFG Recon app — TLS terminates HERE.
#
# Architecture:
#   Internet → router NAT :41234 → Ubuntu VM :41234 (this nginx)
#                                                ↳ /api/*  → localhost:3000 (NestJS)
#                                                ↳ /*      → localhost:3001 (Next.js)
#
# Users visit https://ccrecon.ffgsa.co.za:41234 externally. Nginx
# itself listens on 443 internally; the port translation happens at
# the router NAT. From TLS's perspective it's still port-agnostic —
# the cert is bound to the HOSTNAME, not the port.
#
# Guarantees:
#   1. Only requests whose Host is `ccrecon.ffgsa.co.za` are served.
#      Anything else gets 444 (nginx drops the connection with no
#      response) so scanners see nothing.
#   2. Plain HTTP :80 redirects to https:// with the :41234 port
#      preserved — so a link to http://ccrecon... still works.
#   3. Aggressive rate-limits on auth endpoints throttle brute-force.

# ---------------------------------------------------------------
# Rate-limit zones.
# ---------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_zone:10m  rate=60r/s;

# ---------------------------------------------------------------
# Default server — catch-all that drops everything not addressed to
# our hostname. Needs a cert to bind 443, but replies with 444
# before serving any content, so nothing leaks.
# ---------------------------------------------------------------
server {
  listen 80  default_server;
  listen 41234 ssl default_server;
  server_name _;

  ssl_certificate     /etc/ssl/ccrecon/fullchain.pem;
  ssl_certificate_key /etc/ssl/ccrecon/privkey.pem;

  return 444;
}

# ---------------------------------------------------------------
# HTTP :80 → redirect to HTTPS with :41234 preserved.
# ---------------------------------------------------------------
server {
  listen 80;
  server_name ccrecon.ffgsa.co.za;
  return 301 https://$host:41234$request_uri;
}

# ---------------------------------------------------------------
# The real vhost — HTTPS.
# ---------------------------------------------------------------
server {
  listen 41234 ssl http2;
  server_name ccrecon.ffgsa.co.za;

  ssl_certificate     /etc/ssl/ccrecon/fullchain.pem;
  ssl_certificate_key /etc/ssl/ccrecon/privkey.pem;

  # Modern TLS only.
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;
  ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  # Allow large invoice + statement uploads.
  client_max_body_size 50M;

  # Security headers. HSTS forces HTTPS for a year — only turns on
  # after you've confirmed step 6 works; if TLS breaks, HSTS makes
  # recovery painful because browsers refuse HTTP fallback.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Frame-Options            "SAMEORIGIN" always;
  add_header X-Content-Type-Options     "nosniff" always;
  add_header Referrer-Policy            "strict-origin-when-cross-origin" always;

  # ---- Auth endpoints: aggressive rate limit ----
  location ~ ^/api/auth/(login|forgot-password|reset-password) {
    limit_req zone=auth_zone burst=5 nodelay;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Long timeout — AI statement extraction on large multi-card
    # PDFs can take 3–5 minutes. Anything shorter and the browser
    # sees "Bad Gateway" while the backend is still working.
    proxy_read_timeout 600s;
    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;
  }

  # ---- Backend API ----
  location /api/ {
    limit_req zone=api_zone burst=100 nodelay;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Long timeout — AI statement extraction on large multi-card
    # PDFs can take 3–5 minutes. Anything shorter and the browser
    # sees "Bad Gateway" while the backend is still working.
    proxy_read_timeout 600s;
    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;
  }

  # ---- Frontend (Next.js) ----
  location / {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
  }
}
